<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB7C5" />
      <stop offset="50%" stop-color="#E2CBF7" />
      <stop offset="100%" stop-color="#B2E2F8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FFB7C5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Circular com cantos arredondados -->
  <rect width="512" height="512" rx="128" fill="#FFFDF9"/>
  <circle cx="256" cy="256" r="220" fill="url(#pastelGrad)" opacity="0.25"/>

  <!-- Cabide Coração em tons doces -->
  <g filter="url(#softGlow)">
    <!-- Gancho do cabide -->
    <path d="M256 120 C230 120 220 145 220 165 C220 190 256 195 256 220" fill="none" stroke="#6C5CE7" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Estrutura do cabide em forma de coração suave -->
    <path d="M256 220 L150 290 C120 310 130 350 170 350 L342 350 C382 350 392 310 362 290 Z" fill="#FFFFFF" stroke="#FF7675" stroke-width="16" stroke-linejoin="round"/>
    
    <!-- Coração central decorativo -->
    <path d="M256 310 C240 280 200 280 200 305 C200 325 256 350 256 350 C256 350 312 325 312 305 C312 280 272 280 256 310 Z" fill="#FFB7C5"/>
  </g>

  <!-- Laço delicado das Sisters -->
  <g transform="translate(256, 215)">
    <!-- Asa esquerda do laço -->
    <path d="M0 0 C-40 -30 -60 10 -15 20 Z" fill="#FD79A8"/>
    <!-- Asa direita do laço -->
    <path d="M0 0 C40 -30 60 10 15 20 Z" fill="#FD79A8"/>
    <!-- Nó do laço -->
    <circle cx="0" cy="5" r="12" fill="#FFEAA7" stroke="#FD79A8" stroke-width="4"/>
    <!-- Fitas caídas -->
    <path d="M-6 15 Q-15 45 -25 50" stroke="#FD79A8" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M6 15 Q15 45 25 50" stroke="#FD79A8" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Estrelinhas brilhantes de carinho -->
  <path d="M120 180 Q130 180 130 170 Q130 180 140 180 Q130 180 130 190 Q130 180 120 180 Z" fill="#FDCB6E"/>
  <path d="M380 190 Q390 190 390 180 Q390 190 400 190 Q390 190 390 200 Q390 190 380 190 Z" fill="#00CEC9"/>
  <path d="M360 380 Q370 380 370 370 Q370 380 380 380 Q370 380 370 390 Q370 380 360 380 Z" fill="#FF7675"/>
</svg>
